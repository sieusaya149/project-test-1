<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — InstaClone</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="app-name">InstaClone</span>
      <nav class="site-nav" aria-label="Primary">
        <a href="/" class="nav-link">Feed</a>
        <a href="/new-post" class="nav-link">New post</a>
        <a href="/profile" class="nav-link">Profile</a>
        <a href="/login.html" class="nav-link" data-auth="out">Log in</a>
        <a href="/signup.html" class="nav-link" data-auth="out">Sign up</a>
        <a href="#" class="nav-link" id="logout-link" data-auth="in" hidden>Log out</a>
      </nav>
    </header>

    <main class="site-main">
      <h1>Log in</h1>
      <form id="login-form" class="auth-form" novalidate>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit">Log in</button>
      </form>

      <p class="auth-alt">No account? <a href="/signup.html">Sign up</a></p>
    </main>

    <script src="/app.js"></script>
    <script src="/auth.js"></script>
  </body>
</html>
