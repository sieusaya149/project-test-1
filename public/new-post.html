<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New post — InstaClone</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="app-name">InstaClone</span>
      <nav class="site-nav" aria-label="Primary">
        <form id="search-form" class="search-form" role="search" aria-label="Search people">
          <label for="search-input" class="visually-hidden">Search people</label>
          <input
            id="search-input"
            name="q"
            type="search"
            placeholder="Search people"
            autocomplete="off"
          />
          <ul id="search-results" class="search-results" hidden></ul>
        </form>
        <a href="/" class="nav-link">Feed</a>
        <a href="/new-post.html" class="nav-link">New post</a>
        <a href="/profile" class="nav-link">Profile</a>
        <a href="/login.html" class="nav-link" data-auth="out">Log in</a>
        <a href="/signup.html" class="nav-link" data-auth="out">Sign up</a>
        <a href="#" class="nav-link" id="logout-link" data-auth="in" hidden>Log out</a>
      </nav>
    </header>

    <main class="site-main">
      <h1>New post</h1>
      <form id="new-post-form" class="new-post-form" novalidate>
        <label for="image">Photo (JPEG or PNG, up to 10 MB)</label>
        <input
          id="image"
          name="image"
          type="file"
          accept="image/jpeg,image/png"
          required
        />

        <label for="caption">Caption</label>
        <textarea id="caption" name="caption" rows="3"></textarea>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit">Post</button>
      </form>
    </main>

    <script src="/app.js"></script>
    <script src="/auth.js"></script>
    <script src="/search.js"></script>
    <script src="/new-post.js"></script>
  </body>
</html>
